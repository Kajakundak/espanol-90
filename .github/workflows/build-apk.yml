name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Umožní spustit sestavení i ručně tlačítkem na GitHubu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Nastavení Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Nastavení Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalace závislostí
        run: npm install

      - name: Sestavení Next.js statického webu
        run: npm run build

      - name: Příprava Capacitor Android projektu
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Povolení spuštění Gradle
        run: chmod +x android/gradlew

      - name: Kompilace APK souboru
        run: cd android && ./gradlew assembleDebug

      - name: Uložení hotového APK k okamžitému stažení
        uses: actions/upload-artifact@v4
        with:
          name: Espanol90-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk