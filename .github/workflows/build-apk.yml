name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavení Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Nastavení Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalace závislostí
        run: npm install --legacy-peer-deps

      - name: Sestavení Next.js (statický export)
        env:
          NEXT_PUBLIC_GEMINI_API_KEY: "dummy_build_key"
        run: npm run build

      - name: Příprava a synchronizace Capacitoru
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Oprávnění a sestavení APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Uložení hotového APK k okamžitému stažení
        uses: actions/upload-artifact@v4
        with:
          name: Espanol90-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk